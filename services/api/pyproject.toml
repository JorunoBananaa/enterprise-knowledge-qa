[project]
name = "enterprise-knowledge-qa-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy",
  "psycopg[binary]",
  "pgvector",
  "python-jose[cryptography]",
  "bcrypt>=4.0",
  "python-multipart",
  "langchain",
  "langchain-openai",
  "langchain-huggingface",
  "langchain-anthropic",
  "pypdf",
  "python-docx",
  "python-pptx",
  "openpyxl",
]

[tool.setuptools.packages.find]
include = ["app*"]


